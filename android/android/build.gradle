allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    if (project.name != "app") {
        ext {
            flutter = [
                compileSdkVersion: 35,
                minSdkVersion: 21,
                targetSdkVersion: 35
            ]
        }
    }
    project.plugins.withId("com.android.library") {
        if (!project.plugins.hasPlugin("org.jetbrains.kotlin.android") &&
            !project.plugins.hasPlugin("com.android.built-in-kotlin")) {
            def kotlinDir = new File(project.projectDir, "src/main/kotlin")
            if (kotlinDir.exists()) {
                project.apply plugin: "org.jetbrains.kotlin.android"
            }
        }
        project.androidComponents.finalizeDsl { extension ->
            if (extension.compileSdk == null || extension.compileSdk < 35) {
                extension.compileSdk = 35
            }
            extension.lint.checkReleaseBuilds = false
            extension.lint.abortOnError = false
        }
    }
    project.plugins.withId("kotlin-android") {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                freeCompilerArgs += ["-Xskip-metadata-version-check"]
                if (project.name == "file_picker") {
                    jvmTarget = "17"
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
